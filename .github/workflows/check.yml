name: Controleer WiHTML
on:
  push:
    branches:
      - 'feat/**'
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer HTML en JavaScript
        run: python3 tests/check_site.py
